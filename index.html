<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Малыш и мама</title>
<style>
:root{--bg:#FBF7FC;--card:#fff;--ink:#4A4458;--mute:#8C849B;--pink:#F8D9DF;--mint:#D7EEE3;--lav:#E3DDF4;--sun:#FDEBC4;--acc:#A98BDB;--onacc:#fff;--line:#EEE8F3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1A26;--card:#2A2536;--ink:#EDE8F5;--mute:#A79FB8;--pink:#4A3340;--mint:#2C4339;--lav:#3A3354;--sun:#4B4030;--acc:#C9B1F0;--onacc:#1E1A26;--line:#383248}}
:root[data-theme="dark"]{--bg:#1E1A26;--card:#2A2536;--ink:#EDE8F5;--mute:#A79FB8;--pink:#4A3340;--mint:#2C4339;--lav:#3A3354;--sun:#4B4030;--acc:#C9B1F0;--onacc:#1E1A26;--line:#383248}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Nunito,system-ui,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:16px 16px 96px}
h1,h2,h3{margin:0;font-weight:800}
h1{font-size:24px}h2{font-size:19px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border-radius:24px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.hero{background:var(--lav);border:0;border-radius:32px;padding:20px}
.big{font-size:30px;font-weight:800;line-height:1.2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,.btn{font:inherit;font-weight:800;border:0;border-radius:18px;padding:14px 10px;cursor:pointer;color:var(--ink);background:var(--pink);min-height:48px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.b-mint{background:var(--mint)}.b-sun{background:var(--sun)}.b-lav{background:var(--lav)}
.b-acc{background:var(--acc);color:var(--onacc)}
.pill{display:inline-block;border-radius:999px;padding:6px 12px;background:var(--sun);font-size:14px;font-weight:600;margin:3px 3px 3px 0}
.ev{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border:0}
.ev .ic{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;font-size:19px;flex:none}
.ev .x{margin-left:auto;background:none;color:var(--mute);padding:6px;min-height:0;font-size:18px}
input,textarea{font:inherit;width:100%;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;max-width:520px;width:100%;gap:4px}
nav button{flex:1;background:none;font-size:12px;padding:6px 2px;border-radius:16px;min-height:52px;color:var(--mute)}
nav button span{display:block;font-size:22px}
nav button.on{background:var(--lav);color:var(--ink)}
details{border-bottom:1px solid var(--line);padding:10px 0}
details:last-child{border:0}
summary{font-weight:800;cursor:pointer}
details ul{margin:8px 0 0;padding-left:20px}
details li{margin-bottom:6px}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph figure{margin:0;background:var(--bg);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.ph figcaption{padding:8px 10px;font-size:13px}
.hide{display:none}
.row{display:flex;gap:8px}
svg text{fill:var(--mute);font:11px Nunito,sans-serif}
select{font:inherit;width:100%;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px}
nav button{font-size:11px;padding:6px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:root{--bg:#F5F3FA;--card:#fff;--ink:#1C1A24;--mute:#7A7589;--line:#ECE8F3;--chip:#F1EEF8;--glass:rgba(255,255,255,.8);--sh:0 1px 2px rgba(40,20,80,.05),0 10px 30px rgba(40,20,80,.06);--hero:linear-gradient(140deg,#EBE1FC,#DDEBFF 55%,#FFE6EE);--acc:#7B5CE6;--onacc:#fff;--pink:#FCE4EA;--mint:#DCF1E8;--lav:#E8E1FA;--sun:#FFF0CF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121018;--card:#1C1925;--ink:#F2EFF8;--mute:#9D96AE;--line:#2B2736;--chip:#262231;--glass:rgba(28,25,37,.8);--sh:none;--hero:linear-gradient(140deg,#3A3057,#2B3550 55%,#46303F);--acc:#B8A2F5;--onacc:#1A1424;--pink:#4A3340;--mint:#2C4339;--lav:#3A3354;--sun:#4B4030}}
:root[data-theme="dark"]{--bg:#121018;--card:#1C1925;--ink:#F2EFF8;--mute:#9D96AE;--line:#2B2736;--chip:#262231;--glass:rgba(28,25,37,.8);--sh:none;--hero:linear-gradient(140deg,#3A3057,#2B3550 55%,#46303F);--acc:#B8A2F5;--onacc:#1A1424;--pink:#4A3340;--mint:#2C4339;--lav:#3A3354;--sun:#4B4030}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
main{padding-top:6px}
h1,h2,h3{font-weight:700;letter-spacing:-.025em}
h1{font-size:32px;line-height:1.1}h2{font-size:20px}
.top{margin:8px 0 18px}
.card{border:0;border-radius:22px;box-shadow:var(--sh);padding:18px}
.card.hero{background:var(--hero)!important;border-radius:28px;padding:22px}
.big{font-size:38px;font-weight:700;letter-spacing:-.03em}
button{font-weight:600;transition:transform .12s,opacity .12s}
button:active{transform:scale(.97)}
.grid button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:92px;padding:14px 16px;border-radius:22px;font-size:16px;text-align:left}
.grid button i{font-style:normal;font-size:28px;line-height:1}
.b-acc{background:var(--acc);color:var(--onacc)}
.top button{min-height:40px;padding:8px 14px;border-radius:999px;font-size:14px;background:var(--chip)}
.pill{background:var(--chip);font-size:13px;font-weight:600;padding:7px 12px}
.ev .ic{border-radius:13px}
input,textarea,select{background:var(--chip);border:0;border-radius:14px}
.ph figure{border-radius:20px;border:0;box-shadow:var(--sh)}
nav{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-top:.5px solid var(--line)}
nav button{font-size:10px;font-weight:600;border-radius:12px;min-height:50px}
nav button span{display:grid;place-items:center;margin-bottom:2px}
nav button.on{background:none;color:var(--acc)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg text{font-family:inherit}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main id="app"></main>
<nav><div id="nav"></div></nav>
<script>
const TG=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData?window.Telegram.WebApp:null;if(TG){try{TG.ready();TG.expand()}catch(e){}}
const K='mama-app-v1';
let S={baby:null,ev:[],gr:[],ph:[],fd:[],fi:3,theme:''},tab='today',why='';
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){alert('Не хватило места в памяти браузера. Удалите несколько старых фото.');return false}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=t=>new Date(t).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
const dm=t=>new Date(t).toLocaleDateString('ru',{day:'numeric',month:'short'});
const dur=m=>m<60?m+' мин':Math.floor(m/60)+' ч '+(m%60?m%60+' мин':'');
const same=t=>new Date(t).toDateString()===new Date().toDateString();
const WW=[[1,45,60],[2,60,90],[3,75,120],[4,90,120],[6,120,150],[9,150,210],[99,180,240]];
function ageM(){if(!S.baby)return 0;return (Date.now()-new Date(S.baby.birth))/2629800000}
function ageTxt(){const d=Math.floor((Date.now()-new Date(S.baby.birth))/864e5);if(d<0)return'ещё не родился';if(d<60)return d+' дн.';const m=Math.floor(ageM());return m+' мес.'}
function applyTheme(){const r=document.documentElement;const th=S.theme||(TG&&TG.colorScheme)||'';th?r.setAttribute('data-theme',th):r.removeAttribute('data-theme')}
function setup(){
return `<div class="card hero"><h1>Привет, мамочка 🌸</h1><p>Давайте познакомимся с малышом. Мы подскажем, когда ему пора спать и есть. Все записи хранятся только на вашем устройстве.</p>
<input id="nm" placeholder="Имя малыша"><label class="sub">Дата рождения</label><input id="bd" type="date">
<button class="b-acc" style="width:100%" onclick="startBaby()">Начать</button></div>`}
function startBaby(){const n=nm.value.trim(),b=bd.value;if(!n||!b){alert('Укажите имя и дату рождения');return}S.baby={name:n,birth:b};save();render()}
function add(type,d){const a=S.ev.find(e=>e.type==='sleep'&&!e.end);if(type==='sleep'){if(a)a.end=Date.now();else S.ev.push({t:Date.now(),type,id:Date.now()})}else S.ev.push({t:Date.now(),type,d,id:Date.now()});save();render()}
function del(id){S.ev=S.ev.filter(e=>e.id!==id);save();render()}
function today(){
const a=S.ev.find(e=>e.type==='sleep'&&!e.end);
const sl=S.ev.filter(e=>e.type==='sleep'&&e.end).sort((x,y)=>y.end-x.end);
const td=S.ev.filter(e=>same(e.t)).sort((x,y)=>y.t-x.t);
const sleepMin=Math.round(td.filter(e=>e.type==='sleep').reduce((s,e)=>s+((e.end||Date.now())-e.t)/6e4,0));
const feeds=td.filter(e=>e.type==='feed');
const w=WW.find(x=>ageM()<x[0]);
let hero;
if(a){hero=`<div class="sub">Малыш спит</div><div class="big">уже ${dur(Math.round((Date.now()-a.t)/6e4))}</div><div class="sub">с ${hm(a.t)}. Тише, мы считаем время 🌙</div>`}
else if(sl.length){const l=sl[0].end;hero=`<div class="sub">Следующий сон лучше начать</div><div class="big">${hm(l+w[1]*6e4)}–${hm(l+w[2]*6e4)}</div><div class="sub">Окно бодрствования для ${ageTxt()}: ${w[1]}–${w[2]} мин. Малыш не спит уже ${dur(Math.round((Date.now()-l)/6e4))}. Ищите сонные знаки: потирает глазки, зевает, затихает.</div>`}
else hero=`<div class="sub">Окно бодрствования</div><div class="big">${w[1]}–${w[2]} мин</div><div class="sub">Отметьте первый сон, и мы подскажем, когда укладывать в следующий раз.</div>`;
const last=feeds[0];
const ic={feed:['🍼','var(--pink)'],sleep:['🌙','var(--lav)'],diaper:['💧','var(--mint)']};
return `${ovBanner(a,sl,w)}<div class="card hero">${hero}</div>${wx()}
<div class="grid" style="margin-bottom:14px">
<button class="b-lav" onclick="add('sleep')"><i>${a?'☀️':'🌙'}</i>${a?'Проснулся':'Уснул'}</button>
<button onclick="add('feed','грудь')"><i>🤱</i>Грудь</button>
<button onclick="add('feed','бутылочка')"><i>🍼</i>Бутылочка</button>
<button class="b-mint" onclick="add('diaper')"><i>💧</i>Подгузник</button></div>
<div class="card"><span class="pill">Сон сегодня: ${dur(sleepMin)}</span><span class="pill">Кормлений: ${feeds.length}</span>${nextFeed()}</div>
<div class="card"><h2>Сегодня</h2>${td.length?td.map(e=>`<div class="ev"><div class="ic" style="background:${ic[e.type][1]}">${ic[e.type][0]}</div><div><b>${e.type==='feed'?'Кормление, '+e.d:e.type==='sleep'?'Сон':'Подгузник'}</b><div class="sub">${hm(e.t)}${e.end?' – '+hm(e.end)+' ('+dur(Math.round((e.end-e.t)/6e4))+')':e.type==='sleep'?' – спит':''}</div></div><button class="x" aria-label="Удалить" onclick="del(${e.id})">✕</button></div>`).join(''):'<p class="sub">Пока пусто. Нажмите любую кнопку выше, когда малыш поест или уснёт.</p>'}</div>`}
const WHY={'🍼 Голоден':'Раннее знаки: чмокает, ищет грудь, тянет руки ко рту. Плач — поздний знак, предложите еду.','💧 Мокрый':'Проверьте подгузник и складочки: раздражение доставляет дискомфорт.','🫧 Газики':'Подержите «столбиком», сделайте лёгкий массаж животика по часовой стрелке, поджимайте ножки к животу.','😴 Устал':'Сверьтесь с окном бодрствования. Затемните комнату, включите белый шум, запеленайте.','🌡️ Жарко/холодно':'Потрогайте шейку или спинку: тёплая и сухая — всё хорошо. Комната 20–22 °C.','🤗 Нужны ручки':'Это нормально. Попробуйте слинг, покачивание и «ш-ш-ш» у ушка.'};
const TIPS=[['🤲 Как успокоить малыша',['Пять приёмов: пеленание, положение на боку на ваших руках, «ш-ш-ш» у ушка, плавное покачивание, сосание (грудь или пустышка).','Не стягивайте бёдра в пелёнке: ножки должны свободно сгибаться.','Положение на боку или животе нужно только для успокоения на руках. Спать укладывайте на спину.','Если вы на пределе, положите малыша в кроватку на спину и отдышитесь 5 минут. Это безопасно и нормально.']],
['🌙 Самозасыпание',['Один и тот же ритуал 15–20 минут: купание, массаж, кормление, колыбельная, свет приглушён.','Кладите сонным, но ещё не уснувшим. Начинайте до перегула, в рамках окна бодрствования.','Подождите 2–3 минуты, прежде чем подойти: малыш часто успокаивается сам. Потом погладьте и пошепчите, не сразу берите на руки.','Комната тёмная, 20–22 °C, постоянный фоновый шум. До 3 месяцев ждите нерегулярности, режим формируется постепенно.']],
['✨ Лайфхаки для мамы',['Спите, когда спит малыш. Посуда подождёт.','Готовьте ночной «пост»: смену подгузника, пелёнки, воду, перекус и тёплый ночник на красной лампе рядом с кроваткой.','Записывайте сон и кормления здесь, а не держите в голове. Врачу будет проще.','Запасная пелёнка на матрасе под простынёй: меняете за 10 секунд, не перестилая всё.','Просите помощи конкретно: «Принеси обед в 14:00», а не «Помоги».']],
['🩺 Безопасность и врач',['Спать только на спине, на ровном твёрдом матрасе, без подушек, бортиков и пухлых одеял.','Температура от 38 °C у малыша младше 3 месяцев — сразу к врачу или в скорую.','К врачу также при отказе от еды, слабом мокром подгузнике, вялости, неутешном плаче более 2–3 часов.','Советы здесь справочные и не заменяют педиатра.']]];
function tips(){
return `<div class="card hero" style="background:var(--pink)"><h2>Почему плачет малыш?</h2><div>${Object.keys(WHY).map(k=>`<button class="pill" style="border:0;cursor:pointer;color:var(--ink);min-height:0" onclick="why='${k}';render()">${k}</button>`).join('')}</div>${why?`<p style="margin:10px 0 0"><b>${why}</b><br>${WHY[why]}</p>`:'<p class="sub" style="margin:8px 0 0">Выберите причину, и получите, что с этим делать.</p>'}</div>
<div class="card">${[...TIPS.slice(0,3),['🧥 Как одеть по погоде',dressList()],...TIPS.slice(3)].map(t=>`<details><summary>${t[0]}</summary><ul>${t[1].map(x=>`<li>${x}</li>`).join('')}</ul></details>`).join('')}</div>`}
function addGr(){const w=parseFloat(gw.value.replace(',','.')),h=parseFloat(gh.value.replace(',','.'));if(!w&&!h){alert('Введите вес или рост');return}S.gr.push({t:Date.now(),w:w||null,h:h||null,n:gn.value.trim(),id:Date.now()});save();render()}
function delGr(id){S.gr=S.gr.filter(x=>x.id!==id);save();render()}
function chart(){const p=S.gr.filter(x=>x.w);if(p.length<2)return'';const W=320,H=130,ws=p.map(x=>x.w),mn=Math.min(...ws)-.3,mx=Math.max(...ws)+.3,t0=p[0].t,t1=p[p.length-1].t||1;
const X=x=>20+(x.t-t0)/(t1-t0||1)*(W-40),Y=x=>H-22-(x.w-mn)/(mx-mn)*(H-44);
return `<svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="График веса"><polyline fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${p.map(x=>X(x)+','+Y(x)).join(' ')}"/>${p.map(x=>`<circle cx="${X(x)}" cy="${Y(x)}" r="5" fill="var(--acc)"/><text x="${X(x)}" y="${Y(x)-10}" text-anchor="middle">${x.w}</text>`).join('')}</svg>`}
function growth(){const g=[...S.gr].sort((a,b)=>b.t-a.t);
return `<div class="card"><h2>Рост и вес</h2><div class="row"><input id="gw" inputmode="decimal" placeholder="Вес, кг"><input id="gh" inputmode="decimal" placeholder="Рост, см"></div><input id="gn" placeholder="Заметка (например, осмотр у педиатра)"><button class="b-acc" style="width:100%" onclick="addGr()">Сохранить замер</button></div>
${chart()?`<div class="card">${chart()}</div>`:''}
<div class="card">${g.length?g.map(x=>`<div class="ev"><div class="ic" style="background:var(--sun)">📏</div><div><b>${[x.w&&x.w+' кг',x.h&&x.h+' см'].filter(Boolean).join(' · ')}</b><div class="sub">${dm(x.t)}${x.n?' · '+esc(x.n):''}</div></div><button class="x" aria-label="Удалить" onclick="delGr(${x.id})">✕</button></div>`).join(''):'<p class="sub">Здесь будут все замеры. Добавьте первый.</p>'}</div>`}
function ovBanner(a,sl,w){if(a||!sl.length||S.og===false)return'';const m=Math.round((Date.now()-sl[0].end)/6e4),lo=w[1],hi=w[2],st=m<lo-15?0:m<lo?1:m<=hi?2:3;
const T=[['Бодрствует','Ещё можно играть и общаться.','var(--mint)'],['Скоро спать','Начинайте готовиться: приглушите свет, смените подгузник.','var(--sun)'],['Пора укладывать','Окно сна открыто. Лучше начать ритуал сейчас.','var(--lav)'],['Риск перегула','Малыш бодрствует дольше нормы. Укладывайте сейчас, без новых игр.','var(--pink)']][st];
return `<div class="card" style="background:${T[2]}"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">${T[0]}</h2><span class="sub">${dur(m)} из ${lo}–${hi} мин</span></div><div style="height:8px;border-radius:8px;background:var(--bg);margin:12px 0;overflow:hidden"><div style="width:${Math.min(100,m/hi*100)}%;height:100%;background:var(--acc)"></div></div><p style="margin:0">${T[1]}</p>${st>1?`<button class="b-acc" style="width:100%;margin-top:12px" onclick="tab='calm';render()">Начать укладывание</button><p class="sub" style="margin:10px 0 0">Сонные знаки: зевает, трёт глазки, отводит взгляд, капризничает. Чем раньше уложите, тем легче малыш уснёт.</p>`:''}</div>`}
const DRESS=[[27,'от +27','Лёгкое боди с коротким рукавом или одна тонкая распашонка, тонкая панамка. Гуляйте в тени, предлагайте пить или грудь чаще.'],[22,'+22…+26','Боди с коротким рукавом, тонкие ползунки, лёгкая шапочка. Муслиновая пелёнка на случай ветра.'],[17,'+17…+21','Боди, тонкие ползунки или комбинезон из хлопка, тонкая кофточка и шапочка.'],[12,'+12…+16','Боди, тёплые ползунки, трикотажная или флисовая кофта, демисезонный комбинезон, шапка, носочки.'],[5,'+5…+11','Боди, тёплые ползунки, флисовая кофта, тёплый комбинезон или конверт, шапка, носки.'],[-5,'−5…+4','Термобельё или боди, тёплые ползунки, флис, зимний комбинезон, тёплая шапка, варежки, шерстяные носки.'],[-15,'−15…−6','Многослойно: термобельё, флис, зимний комбинезон или конверт, шапка с подкладкой, варежки, шерстяные носки. Прогулка 15–30 минут.'],[-99,'ниже −15','Малышу до 3 месяцев лучше остаться дома или выйти на застёкленный балкон. Для старших: короткая прогулка, закрытое лицо от ветра, решите вместе с педиатром.']];
const CX={'🌧️':'Дождь: дождевик или непромокаемая накидка на коляску.','❄️':'Снег: верхняя одежда должна быть непромокаемой.','💨':'Ветер: на один слой тёплее, шапка завязывается, закройте лицо от ветра.','☀️':'Солнце: до 6 месяцев избегайте прямых лучей, панамка и тень.'};
const clockTxt=()=>new Date().toLocaleDateString('ru',{weekday:'short',day:'numeric',month:'short'})+', '+hm(Date.now());
function dressText(t,c){if(t==null)return'Посмотрите температуру за окном и сдвиньте ползунок: подскажем, как одеть малыша.';const d=DRESS.find(x=>t>=x[0]);return'<b>Как одеть:</b> '+d[2]+((c==='☀️'&&t<18)||!CX[c]?'':' '+CX[c])}
function dressList(){return DRESS.map(d=>'<b>'+d[1]+' °C:</b> '+d[2]).concat(['Проверка: потрогайте шею или спинку. Тёплая и сухая значит одет правильно. Холодные ручки и ножки это норма, потная шея значит жарко.','Правило: малыш одет примерно на один слой тёплее взрослого. В машине и в помещении верхнюю одежду снимайте, чтобы не перегреть.'])}
function wtv(v){const w=S.wx=S.wx||{t:null,c:'☀️'};w.t=v;w.at=Date.now();save();document.getElementById('wxt').textContent=(v>0?'+':'')+v+'°';document.getElementById('wxd').innerHTML=dressText(v,w.c)}
function wc(c){const w=S.wx=S.wx||{t:null};w.c=c;save();render()}
function wx(){const w=S.wx||{t:null,c:'☀️'},t=w.t;
return `<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Погода за окном</h2><b id="wxt" style="font-size:26px">${t==null?'—':(t>0?'+':'')+t+'°'}</b></div><input type="range" min="-30" max="40" value="${t==null?15:t}" oninput="wtv(+this.value)" aria-label="Температура на улице" style="padding:0;margin:12px 0 4px"><div class="row" style="flex-wrap:wrap">${['☀️','⛅','🌧️','❄️','💨'].map(c=>`<button class="pill" style="border:0;min-height:0;cursor:pointer;color:var(--ink)${w.c===c?';background:var(--acc);color:var(--onacc)':''}" onclick="wc('${c}')">${c}</button>`).join('')}</div><p id="wxd" style="margin:10px 0 0">${dressText(t,w.c)}</p>${w.at?`<div class="sub" style="margin-top:6px">Температура введена в ${hm(w.at)}. Обновите перед прогулкой.</div>`:''}</div>`}
function nextFeed(){const f=S.ev.filter(e=>e.type==='feed').sort((a,b)=>b.t-a.t)[0];if(!f)return'';const n=f.t+S.fi*36e5,m=Math.round((n-Date.now())/6e4);return m>0?`<span class="pill">Кормили в ${hm(f.t)}, следующее ~${hm(n)} (через ${dur(m)})</span>`:`<span class="pill" style="background:var(--pink)">🍼 Пора кормить: прошло ${dur(Math.round((Date.now()-f.t)/6e4))}</span>`}
let AC,src,vg,mel,tmr,el,playing='',vol=.3,mul=1,tm=0;
const LU=[329.6,329.6,392,0,329.6,329.6,392,0,329.6,392,523.3,493.9,440,440,392,0,293.7,329.6,349.2,293.7,293.7,329.6,349.2,0,293.7,349.2,493.9,440,392,523.3,0,0];
function stopSnd(){try{src&&src.stop()}catch(e){}el&&el.pause();clearInterval(mel);clearTimeout(tmr);src=null;playing=''}
function box(f){if(!f)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(vg);const t=AC.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.9,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+1.3);o.start(t);o.stop(t+1.4)}
function play(k){stopSnd();try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();mul=k==='deep'?3:k==='rain'?2:1;vg=AC.createGain();vg.gain.value=vol*mul;let out=AC.destination;try{const ds=AC.createMediaStreamDestination();el=el||new Audio();el.srcObject=ds.stream;el.play();out=ds}catch(e){}vg.connect(out);
if(k==='lull'){let i=0;mel=setInterval(()=>box(LU[i++%LU.length]),520)}else{const b=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;src=AC.createBufferSource();src.buffer=b;src.loop=true;const f=AC.createBiquadFilter();if(k==='deep'){f.type='lowpass';f.frequency.value=350}else if(k==='rain'){f.type='bandpass';f.frequency.value=2500;f.Q.value=.4}else f.type='allpass';src.connect(f);f.connect(vg);src.start()}
playing=k;if(tm)tmr=setTimeout(()=>{stopSnd();render()},tm*6e4)}catch(e){alert('Звук недоступен в этом браузере')}render()}
function calm(){const T=[['white','🌫️ Белый шум'],['deep','🫧 Глубокий, как в животике'],['rain','🌧️ Дождь'],['lull','🎵 Колыбельная']];
return `<div class="card hero" style="background:var(--mint)"><h2>Убаюкать</h2><p class="sub">Ровный шум напоминает малышу о жизни в животике. Ставьте телефон в 1–2 метрах от кроватки, громкость не выше шума душа. Если не слышно, увеличьте громкость телефона и выключите беззвучный режим.</p><div class="grid">${T.map(t=>`<button class="${playing===t[0]?'b-acc':'b-lav'}" onclick="${playing===t[0]?'stopSnd();render()':`play('${t[0]}')`}">${playing===t[0]?'⏸ ':''}${t[1]}</button>`).join('')}</div></div><div class="card"><h2>Ритуал на 5 минут</h2><ol style="margin:0;padding-left:20px"><li>Приглушите свет, уберите яркие игрушки.</li><li>Смените подгузник, запеленайте или оденьте в спальный мешок.</li><li>Включите шум и покачайте на руках 2–3 минуты.</li><li>Положите сонным, но не спящим, и побудьте рядом.</li></ol></div><div class="card"><label class="sub">Громкость</label><input type="range" min="0.05" max="1" step="0.05" value="${vol}" oninput="vol=+this.value;vg&&(vg.gain.value=vol*mul)" style="padding:0"><div class="sub" style="margin:6px 0">Выключить через:</div><div class="row">${[15,30,60,0].map(m=>`<button class="${tm===m?'b-acc':'b-sun'}" style="flex:1;padding:10px 0" onclick="tm=${m};playing?play(playing):render()">${m?m+' мин':'∞'}</button>`).join('')}</div></div>`}
function stats(){const rows=[...Array(7)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);const a=+d,b=a+864e5;return{d,sl:S.ev.filter(e=>e.type==='sleep'&&e.t>=a&&e.t<b).reduce((s,e)=>s+((e.end||Date.now())-e.t)/36e5,0),fd:S.ev.filter(e=>e.type==='feed'&&e.t>=a&&e.t<b).length}});const mx=Math.max(1,...rows.map(r=>r.sl));
return `<div class="card"><h2>Неделя: сон и кормления</h2>${rows.map(r=>`<div class="row" style="align-items:center;margin-bottom:6px"><span class="sub" style="width:30px">${r.d.toLocaleDateString('ru',{weekday:'short'})}</span><div style="flex:1;background:var(--bg);border-radius:10px;height:22px"><div style="width:${r.sl/mx*100}%;background:var(--lav);height:100%;border-radius:10px"></div></div><span class="sub" style="width:96px;text-align:right">${r.sl.toFixed(1)} ч · ${r.fd} корм.</span></div>`).join('')}</div>`}
function addFd(){const n=fn.value.trim();if(!n){alert('Введите продукт');return}S.fd.push({t:Date.now(),n,r:fr.value,id:Date.now()});save();render()}
function exp(){bk.value=JSON.stringify(Object.assign({},S,{ph:[]}))}
function imp(){try{const o=JSON.parse(bk.value);if(!o.baby)throw 0;S=Object.assign(S,o,{ph:S.ph});save();render()}catch(e){alert('Не удалось прочитать данные. Вставьте текст, скопированный в приложении.')}}
function more(){const fd=[...S.fd].sort((a,b)=>b.t-a.t);
return stats()+`<div class="card"><h2>Прикорм</h2><p class="sub">Обычно начинают около 6 месяцев по рекомендации педиатра. Новый продукт вводят один, раз в 3–5 дней, и наблюдают за реакцией.</p><input id="fn" placeholder="Продукт (например, кабачок)"><select id="fr"><option>Хорошо ест</option><option>Не понравилось</option><option>Сыпь или другая реакция</option></select><button class="b-acc" style="width:100%;margin-bottom:8px" onclick="addFd()">Записать</button>${fd.map(x=>`<div class="ev"><div class="ic" style="background:var(--mint)">🥣</div><div><b>${esc(x.n)}</b><div class="sub">${dm(x.t)} · ${esc(x.r)}</div></div><button class="x" aria-label="Удалить" onclick="S.fd=S.fd.filter(y=>y.id!==${x.id});save();render()">✕</button></div>`).join('')}</div><div class="card"><h2>Настройки</h2><label class="sub">Кормить примерно каждые</label><select onchange="S.fi=+this.value;save();render()">${[2,2.5,3,3.5,4].map(h=>`<option value="${h}"${S.fi===h?' selected':''}>${h} ч</option>`).join('')}</select><label class="sub">Подсказки против перегула</label><select onchange="S.og=this.value==='1';save();render()"><option value="1"${S.og!==false?' selected':''}>Включены</option><option value="0"${S.og===false?' selected':''}>Выключены</option></select><h3 style="font-size:16px;margin:8px 0">Копия данных</h3><p class="sub">Скопируйте текст и вставьте на другом устройстве. Фото не переносятся.</p><textarea id="bk" rows="3" placeholder="Здесь появятся данные"></textarea><div class="row"><button class="b-lav" style="flex:1" onclick="exp()">Показать</button><button class="b-mint" style="flex:1" onclick="imp()">Загрузить</button></div></div><div class="card"><h2>Конфиденциальность</h2><p class="sub">Приложение не требует регистрации и не отправляет ваши данные на сервер. Всё, что вы записываете (имя и дата рождения малыша, сон, кормления, рост, вес, фото), хранится только в памяти вашего устройства. Нет аналитики, рекламы и сторонних трекеров. Советы справочные и не заменяют врача.</p><button class="b-pink" style="width:100%" onclick="if(confirm('Удалить все записи на этом устройстве?')){try{localStorage.removeItem(K)}catch(e){}S={baby:null,ev:[],gr:[],ph:[],fd:[],fi:3,theme:''};tab='today';render()}">Удалить все данные</button></div>`}
function pick(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.ph.unshift({t:Date.now(),src:c.toDataURL('image/jpeg',.72),n:pc.value.trim(),id:Date.now()});if(!save())S.ph.shift();render()};im.src=r.result};r.readAsDataURL(f)}
function delPh(id){S.ph=S.ph.filter(x=>x.id!==id);save();render()}
function album(){return `<div class="card"><h2>Альбом первых дней</h2><input id="pc" placeholder="Подпись к фото (необязательно)"><input id="pf" type="file" accept="image/*" class="hide" onchange="pick(this.files[0])"><button class="b-acc" style="width:100%" onclick="pf.click()">📷 Добавить фото</button></div>
${S.ph.length?`<div class="ph">${S.ph.map(x=>`<figure><img src="${x.src}" alt="Фото малыша"><figcaption><b>${dm(x.t)}</b>${x.n?'<br>'+esc(x.n):''}<br><button class="x" style="background:none;padding:2px;min-height:0;color:var(--mute);font-size:13px" onclick="delPh(${x.id})">Удалить</button></figcaption></figure>`).join('')}</div>`:'<p class="sub">Фото хранятся только на этом устройстве.</p>'}`}
function render(){
applyTheme();
const A=document.getElementById('app'),N=document.getElementById('nav');
if(!S.baby){A.innerHTML=setup();N.innerHTML='';return}
const tabs=[['today','<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>','Сегодня'],['calm','<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>','Убаюкать'],['tips','<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>','Советы'],['growth','<svg viewBox="0 0 24 24"><path d="M3 21h18M6 21v-8M12 21V5M18 21V10"/></svg>','Рост'],['album','<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>','Альбом'],['more','<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>','Ещё']];
N.innerHTML=tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render();scrollTo(0,0)"><span>${t[1]}</span>${t[2]}</button>`).join('');
const dark=document.documentElement.getAttribute('data-theme')==='dark'||(!S.theme&&matchMedia('(prefers-color-scheme:dark)').matches);
A.innerHTML=`<div class="top"><div><h1>${esc(S.baby.name)} 🌷</h1><div class="sub">${ageTxt()} · <span id="clk">${clockTxt()}</span></div></div><button class="b-sun" onclick="S.theme='${dark?'light':'dark'}';save();render()" aria-label="Ночной режим">${dark?'☀️ День':'🌙 Ночь'}</button></div>`+({today,calm,tips,growth,album,more}[tab])();
}
render();
setInterval(()=>{if(tab==='today'&&S.baby&&!document.activeElement.matches('input'))render()},15000);setInterval(()=>{const e=document.getElementById('clk');if(e)e.textContent=clockTxt()},10000);
</script>
